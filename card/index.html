<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>황혜인 · 브랜드 스토리텔러</title>
<meta name="description" content="안녕하세요, 브랜드 스토리텔러 황혜인 강사입니다.">
<meta property="og:title" content="황혜인 · 브랜드 스토리텔러 강사">
<meta property="og:description" content="안녕하세요, 브랜드 스토리텔러 황혜인 강사입니다. 연락처 저장 · 카카오톡 · 포트폴리오">
<meta property="og:url" content="https://phase0.shop/card/">
<meta name="theme-color" content="#f6f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1ea; --card: #fffdf9; --ink: #1f1a17; --muted: #6f655d;
    --line: #e5dcd1; --accent: #b4532a; --accent-soft: #f3e1d6;
    --kakao: #fee500; --serif: 'Noto Serif KR', serif;
    --sans: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #171412; --card: #211d1a; --ink: #f3ece4; --muted: #a99d92;
            --line: #362f2a; --accent: #e08455; --accent-soft: #3a2a20; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans);
         line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 64px; }

  header { text-align: center; padding: 24px 0 8px; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 18px; overflow: hidden;
            background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
            font: 700 34px var(--serif); border: 1px solid var(--line); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .greet { font: 500 15px var(--sans); color: var(--muted); }
  h1 { font: 700 30px/1.3 var(--serif); margin: 4px 0 2px; letter-spacing: -0.02em; }
  .role { color: var(--accent); font-weight: 600; font-size: 15px; }
  .intro { margin: 16px auto 0; max-width: 400px; font-size: 15px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
  .tags span { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }

  .links .hint { margin: -4px 0 4px; }
  .hint { text-align: center; font-size: 12.5px; color: var(--muted); min-height: 1em; }

  .socials { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .socials a { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
               background: var(--card); border: 1px solid var(--line); font-weight: 800; font-size: 14px; }
  .socials svg { width: 18px; height: 18px; }

  .links { display: grid; gap: 12px; margin-top: 24px; }
  .links .group { font: 700 13px var(--sans); color: var(--muted); text-align: center; margin: 14px 0 -2px; letter-spacing: .02em; }
  .link { position: relative; display: flex; align-items: center; justify-content: center; min-height: 60px;
          padding: 12px 56px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
          font-weight: 600; font-size: 15px; text-align: center; line-height: 1.4;
          box-shadow: 0 1px 0 var(--line); transition: transform .15s ease, box-shadow .15s ease; }
  .link:active { transform: scale(.98); }
  @media (hover: hover) { .link:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); } }
  .link .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px;
               border-radius: 10px; display: grid; place-items: center; font-size: 20px; overflow: hidden; }
  .link .ico img { width: 100%; height: 100%; object-fit: cover; }
  .link small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .link.kakao { background: var(--kakao); color: #191600; border-color: transparent; }
  .link.kakao small { color: #5b5200; }
  .link.accent { background: var(--accent); color: #fff; border-color: transparent; }
  .link.accent small { color: #fbe3d6; }

  .courses { display: grid; gap: 12px; }
  .course { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
  .course h3 { font: 700 17px/1.4 var(--serif); margin: 8px 0 2px; }
  .course .dur { font-size: 12.5px; color: var(--muted); }
  .course > p { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .course details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .course summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--accent); list-style: none; }
  .course summary::-webkit-details-marker { display: none; }
  .course summary::after { content: ' ▾'; }
  .course details[open] summary::after { content: ' ▴'; }
  .course ol { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .course li { counter-increment: s; display: flex; gap: 10px; font-size: 14px; padding: 6px 0; }
  .course li::before { content: counter(s, decimal-leading-zero); font: 700 12px var(--sans); color: var(--accent);
                       background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; height: fit-content; }
  .course .ask { display: block; margin-top: 14px; text-align: center; padding: 11px; border-radius: 12px;
                 background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14px; }

  section { margin-top: 44px; }
  h2 { font: 700 19px var(--serif); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 small { font: 400 12px var(--sans); color: var(--muted); }

  .remember { display: block; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
  .remember img { display: block; width: 100%; }
  .remember p { padding: 12px 14px; font-size: 13.5px; color: var(--muted); }

  .pf { display: grid; gap: 12px; }
  .pf article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .pf img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .pf .body { padding: 14px 16px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .chip { color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 99px; font-weight: 600; }
  .pf h3, .feed h3 { font-size: 15.5px; margin: 6px 0 4px; line-height: 1.45; }
  .pf p, .feed p { font-size: 13.5px; color: var(--muted); }

  .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .filters button { font: 600 13px var(--sans); padding: 6px 12px; border-radius: 99px; cursor: pointer;
                    border: 1px solid var(--line); background: transparent; color: var(--muted); white-space: nowrap; }
  .filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .feed { display: grid; gap: 10px; }
  .feed a { display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .feed .thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex: none; background: var(--accent-soft); }
  .feed .txt { min-width: 0; }
  .feed p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { font-size: 13.5px; color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
  .src-naver { color: #03a94d; } .src-tistory { color: #eb531f; } .src-threads { color: var(--ink); }

  footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--muted); }
  footer a { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar" id="avatar">혜</div>
    <p class="greet" id="greet">안녕하세요, 브랜드 스토리텔러 황혜인 강사입니다.</p>
    <h1 id="name">황혜인</h1>
    <p class="role" id="role">브랜드 스토리텔러 · 강사</p>
    <p class="intro" id="intro"></p>
    <div class="tags" id="tags"></div>
    <nav class="socials" id="socials" aria-label="SNS·연락처"></nav>
  </header>


  <div class="links" id="links"></div>
  <p class="hint" id="hint"></p>

  <section id="courses-sec">
    <h2>강의 프로그램 <small>기관·기업 맞춤 조정 가능</small></h2>
    <div class="courses" id="courses"><p class="empty">강의 프로그램을 불러오는 중…</p></div>
  </section>

  <section id="rememberSec" hidden>
    <h2>리멤버 명함 <small>탭하면 리멤버에서 열려요</small></h2>
    <a class="remember" id="remember">
      <img src="assets/remember-card.jpg" alt="리멤버에 등록된 황혜인 명함" onerror="this.remove()">
      <p>리멤버 앱에서 명함 받기 →</p>
    </a>
  </section>

  <section id="portfolio-sec">
    <h2>포트폴리오 <small>강의 · 프로젝트 기록</small></h2>
    <div class="pf" id="portfolio"><p class="empty">포트폴리오를 불러오는 중…</p></div>
  </section>

  <section id="posts">
    <h2>최근 글 <small id="updated"></small></h2>
    <div class="filters" id="filters">
      <button class="on" data-f="all">전체</button>
      <button data-f="naver">네이버 블로그</button>
      <button data-f="tistory">티스토리</button>
      <button data-f="threads">스레드</button>
    </div>
    <div class="feed" id="feed"><p class="empty">글을 불러오는 중…</p></div>
  </section>

  <footer>
    <p>© PHASE0 · <a href="https://phase0.shop">phase0.shop</a></p>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const real = v => v && !String(v).includes('TODO');
const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
};
const SRC = { naver: '네이버 블로그', tistory: '티스토리', threads: '스레드' };

// 아이폰 / 안드로이드 판별 (?os=ios|android 로 강제 가능)
const qsOS = new URLSearchParams(location.search).get('os');
const ua = navigator.userAgent;
const os = qsOS || (/iPhone|iPad|iPod/.test(ua) ? 'ios' : /Android/.test(ua) ? 'android' : 'pc');
const HINTS = {
  ios: '아이폰: 버튼을 누르면 연락처 미리보기가 열려요 → 오른쪽 위 ‘공유’ 또는 ‘새로운 연락처 생성’',
  android: '안드로이드: 다운로드된 파일을 누르면 연락처 앱으로 저장돼요 (삼성·LG 모두 가능)',
  pc: 'PC에서는 .vcf 파일이 내려받아집니다. 휴대폰으로 QR을 찍으면 바로 저장돼요.'
};

function link(id, href) { const a = $(id); if (!real(href)) return; a.href = href; a.hidden = false; }

async function load(path, fallback) {
  try { const r = await fetch(path, { cache: 'no-cache' }); return r.ok ? await r.json() : fallback; }
  catch { return fallback; }
}

(async () => {
  $('hint').textContent = HINTS[os];

  const p = await load('profile.json', null);
  if (p) {
    $('greet').textContent = p.greeting;
    $('name').textContent = p.name;
    $('role').textContent = p.title;
    $('intro').textContent = p.intro;
    $('tags').innerHTML = (p.topics || []).map(t => `<span>${escape(t)}</span>`).join('');
    const L = p.links || {};
    const tel = real(p.phone) ? p.phone.replace(/[^\d+]/g, '') : '';
    const vars = { ...L, phone: tel, email: real(p.email) ? p.email : '', website: p.website };
    // {kakao} 같은 자리표시를 profile.json 의 실제 값으로 바꾸고, 값이 비어 있으면 버튼을 숨김
    const fill = u => { let ok = true; const out = String(u || '').replace(/\{(\w+)\}/g, (_, k) => real(vars[k]) ? vars[k] : (ok = false, '')); return ok && real(out) ? out : ''; };
    const ext = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '';

    $('socials').innerHTML = [
      ['tel:{phone}', '전화', ICONS.phone], ['mailto:{email}', '이메일', ICONS.mail],
      ['{naverBlog}', '네이버 블로그', '<b class="src-naver">N</b>'], ['{tistory}', '티스토리', '<b class="src-tistory">T</b>'],
      ['{threads}', '스레드', '<b class="src-threads">@</b>'], ['{website}', 'phase0.shop', ICONS.web],
    ].map(([u, label, ico]) => { const h = fill(u); return h ? `<a href="${escape(h)}" aria-label="${label}" title="${label}"${ext(h)}>${ico}</a>` : ''; }).join('');

    $('links').innerHTML = (p.buttons || []).map(b => {
      if (b.group) return `<p class="group">${escape(b.group)}</p>`;
      const h = fill(b.url); if (!h) return '';
      const ico = b.image ? `<img src="${escape(b.image)}" alt="">` : escape(b.icon || '');
      return `<a class="link ${escape(b.style || '')}" href="${escape(h)}"${ext(h)}>
        ${ico ? `<span class="ico">${ico}</span>` : ''}
        <span>${escape(b.label)}${b.sub ? `<small>${escape(b.sub)}</small>` : ''}</span></a>`;
    }).join('').replace(/(<p class="group">[^<]*<\/p>)(?=<p class="group">|$)/g, '');
    if (os === 'android') $('links').querySelectorAll('a[href$=".vcf"]').forEach(a => a.setAttribute('download', '황혜인_연락처.vcf'));
    const vcf = $('links').querySelector('a[href$=".vcf"]'); if (vcf) vcf.after($('hint'));
    if (real(L.remember)) { $('remember').href = L.remember; $('rememberSec').hidden = false; }
  }
  const img = new Image();
  img.onload = () => { $('avatar').textContent = ''; $('avatar').appendChild(img); };
  img.src = 'assets/profile.jpg'; img.alt = '황혜인 프로필 사진';

  const pf = (await load('portfolio.json', [])).filter(x => x.title);
  $('portfolio').innerHTML = pf.length ? pf.map(x => `
    <article>
      ${x.image ? `<img src="${escape(x.image)}" alt="" loading="lazy">` : ''}
      <div class="body">
        <div class="meta"><span class="chip">${escape(x.type)}</span><span>${escape(x.date)}</span></div>
        <h3>${x.link ? `<a href="${escape(x.link)}">${escape(x.title)} ↗</a>` : escape(x.title)}</h3>
        <p>${escape(x.desc)}</p>
      </div>
    </article>`).join('') : '<p class="empty">곧 강의 기록이 채워질 예정입니다.</p>';

  // 강의 문의 버튼: 카카오톡 > 이메일 순으로 연결
  const askUrl = p && real(p.links?.kakao) ? p.links.kakao : p && real(p.email) ? 'mailto:' + p.email : '';
  const cs = (await load('curriculum.json', [])).filter(x => x.title);
  $('courses').innerHTML = cs.length ? cs.map(c => `
    <article class="course">
      <div class="meta"><span class="chip">${escape(c.tag)}</span></div>
      <h3>${escape(c.title)}</h3>
      <p class="dur">${escape(c.duration)}</p>
      <p>${escape(c.summary)}</p>
      ${c.sessions?.length ? `<details><summary>커리큘럼 ${c.sessions.length}차시 보기</summary>
        <ol>${c.sessions.map(x => `<li><span>${escape(x)}</span></li>`).join('')}</ol></details>` : ''}
      ${askUrl ? `<a class="ask" href="${escape(askUrl.startsWith('mailto:') ? askUrl + '?subject=' + encodeURIComponent('[강의 문의] ' + c.title) : askUrl)}"${/^https?:/.test(askUrl) ? ' target="_blank" rel="noopener"' : ''}>이 강의 문의하기</a>` : ''}
    </article>`).join('') : '<p class="empty">강의 프로그램을 준비 중입니다.</p>';

  const feed = await load('feed.json', { items: [] });
  if (feed.updated) $('updated').textContent = new Date(feed.updated).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) + ' 갱신';
  const render = f => {
    const items = feed.items.filter(x => f === 'all' || x.source === f);
    $('feed').innerHTML = items.length ? items.map(x => `
      <a href="${escape(x.link)}" target="_blank" rel="noopener">
        ${x.image ? `<img class="thumb" src="${escape(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
        <div class="txt">
          <div class="meta"><b class="src-${x.source}">${SRC[x.source]}</b><span>${x.date ? new Date(x.date).toLocaleDateString('ko-KR') : ''}</span></div>
          <h3>${escape(x.title)}</h3><p>${escape(x.summary)}</p>
        </div>
      </a>`).join('') : '<p class="empty">아직 연동된 글이 없어요.</p>';
  };
  $('filters').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('filters').children].forEach(x => x.classList.toggle('on', x === b));
    render(b.dataset.f);
  };
  render('all');
})();
</script>
</body>
</html>
