<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Creative Experience</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color-rgb: 10, 10, 12;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-color: #6366f1;
            --accent-secondary: #ec4899;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover-bg: rgba(255, 255, 255, 0.15);
            --glow-color: 99, 102, 241;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Space Grotesk', sans-serif;
            --transition-speed: 0.5s;
        }

        .light-mode {
            --bg-color-rgb: 248, 250, 252;
            --text-color: #0f172a;
            --text-muted: #475569;
            --card-bg: rgba(15, 23, 42, 0.03);
            --card-border: rgba(15, 23, 42, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.08);
            --accent-color: #4f46e5;
            --accent-secondary: #db2777;
            --btn-bg: rgba(15, 23, 42, 0.05);
            --btn-hover-bg: rgba(15, 23, 42, 0.12);
            --glow-color: 79, 70, 229;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: rgb(var(--bg-color-rgb));
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        /* 3D Background Canvas */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Custom Cursor Stalker */
        .cursor-stalker {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(var(--glow-color), 0.12) 0%, rgba(var(--glow-color), 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: width 0.3s, height 0.3s;
            mix-blend-mode: screen;
        }

        .light-mode .cursor-stalker {
            background: radial-gradient(circle, rgba(var(--glow-color), 0.06) 0%, rgba(var(--glow-color), 0) 70%);
            mix-blend-mode: multiply;
        }

        /* App Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 580px;
            text-align: center;
            perspective: 1000px;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color var(--transition-speed), 
                        background var(--transition-speed);
            transform-style: preserve-3d;
        }

        .card:hover {
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3),
                        0 0 40px var(--accent-glow);
        }

        /* Typography & Content */
        .tagline {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            display: inline-block;
            position: relative;
            transform: translateZ(30px);
        }

        .tagline::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            border-radius: 2px;
        }

        .title-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
            transform: translateZ(50px);
        }

        .main-title {
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-color) 30%, var(--accent-color) 70%, var(--accent-secondary) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 6s linear infinite;
        }

        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
            transform: translateZ(30px);
        }

        /* Buttons & Actions */
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            transform: translateZ(40px);
        }

        .btn {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.9rem 1.8rem;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: var(--btn-bg);
            color: var(--text-color);
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .btn-primary {
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(var(--glow-color), 0.2);
        }

        .btn-primary::before {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(var(--glow-color), 0.35);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-3px);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover svg {
            transform: translateX(3px) scale(1.1);
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            background: var(--btn-hover-bg);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.5s ease;
        }

        /* Floating Info Footer */
        .footer-info {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .footer-info:hover {
            opacity: 1;
        }

        /* SVG Icons definitions */
        .icon-sun { display: none; }
        .light-mode .icon-sun { display: block; }
        .light-mode .icon-moon { display: none; }

        /* Media Queries */
        @media (max-width: 640px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }
            .main-title {
                font-size: 2.8rem;
            }
            .subtitle {
                font-size: 0.95rem;
                margin-bottom: 2rem;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Scene Background -->
    <div id="canvas-container"></div>

    <!-- Custom Cursor Glow -->
    <div class="cursor-stalker" id="cursorStalker"></div>

    <!-- Mode Controller -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
        <!-- Moon Icon -->
        <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 3zm0 2a7 7 0 1 0 5.002 11.901A9.5 9.5 0 0 1 12 5z"/>
        </svg>
        <!-- Sun Icon -->
        <svg class="icon-sun" viewBox="0 0 24 24">
            <path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0-7a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zM5.636 5.636a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 0 1-1.414 1.414L6.222 7.05a1 1 0 0 1-1.414-1.414zm11.314 11.314a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 0 1-1.414 1.414l-1.414-1.414a1 1 0 0 1 0-1.414zM2 12a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2H3a1 1 0 0 1-1-1zm15 0a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2h-2a1 1 0 0 1-1-1zM5.636 18.364a1 1 0 0 1 0-1.414l1.414-1.414a1 1 0 1 1 1.414 1.414l-1.414 1.414a1 1 0 0 1-1.414 0zm11.314-11.314a1 1 0 0 1 0-1.414l1.414-1.414a1 1 0 1 1 1.414 1.414l-1.414 1.414a1 1 0 0 1-1.414 0z"/>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="app-container">
        <div class="card" id="interactiveCard">
            <span class="tagline">Creative Tech Showcase</span>
            <div class="title-wrapper">
                <h1 class="main-title">HELLO<br>WORLD</h1>
            </div>
            <p class="subtitle">
                Welcome to a premium, interactive digital experience built using modern WebGL particle simulation and progressive responsive design.
            </p>
            <div class="actions">
                <button class="btn btn-primary" id="btnExplore">
                    Explore Magic
                    <svg viewBox="0 0 24 24">
                        <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"/>
                    </svg>
                </button>
                <button class="btn btn-secondary" id="btnToggleMotion">
                    Pause Motion
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Info -->
    <div class="footer-info">
        Designed &amp; Engineered &bull; 2026
    </div>

    <!-- External Libraries (Three.js and Canvas Confetti) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // Custom Cursor Stalker Logic
        const stalker = document.getElementById('cursorStalker');
        let stalkerX = 0, stalkerY = 0;
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateStalker() {
            // Smooth interpolation
            stalkerX += (mouseX - stalkerX) * 0.1;
            stalkerY += (mouseY - stalkerY) * 0.1;
            
            stalker.style.left = `${stalkerX}px`;
            stalker.style.top = `${stalkerY}px`;
            requestAnimationFrame(animateStalker);
        }
        animateStalker();

        // 3D Card Tilt Effect
        const card = document.getElementById('interactiveCard');
        const container = document.querySelector('.app-container');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Limit tilt angle to max 12 degrees
            const tiltX = (y / (rect.height / 2)) * -12;
            const tiltY = (x / (rect.width / 2)) * 12;

            card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        let isDarkMode = true;

        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode', !isDarkMode);
            
            // Transition Particle System Colors
            transitionParticlesColors();
        });

        // Three.js 3D Interactive Particles Setup
        let scene, camera, renderer, particleSystem;
        let particles = [];
        let isMotionActive = true;
        const particleCount = 1400;
        
        // Colors corresponding to dark / light modes
        const darkParticleColors = [0x6366f1, 0xec4899, 0xa855f7, 0x3b82f6];
        const lightParticleColors = [0x4f46e5, 0xdb2777, 0x8b5cf6, 0x2563eb];
        
        function initThree() {
            const containerEl = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 250;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            containerEl.appendChild(renderer.domElement);

            // Create custom particle texture using canvas (soft circle)
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 16;
            pCanvas.height = 16;
            const ctx = pCanvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            const pTexture = new THREE.CanvasTexture(pCanvas);

            // Particles Geometry
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            const activeColorPalette = isDarkMode ? darkParticleColors : lightParticleColors;

            for (let i = 0; i < particleCount; i++) {
                // Sphere shape distribution
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 100 + Math.random() * 150; // Radius

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Color distribution
                const hexColor = activeColorPalette[Math.floor(Math.random() * activeColorPalette.length)];
                const color = new THREE.Color(hexColor);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                // Cache base positions for animations
                particles.push({
                    x: x, y: y, z: z,
                    speedX: (Math.random() - 0.5) * 0.15,
                    speedY: (Math.random() - 0.5) * 0.15,
                    speedZ: (Math.random() - 0.5) * 0.15,
                    colorObj: color
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 3.5,
                map: pTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // Handle Resize
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Particle Interaction & Animation loop
        let angle = 0;
        function animateThree() {
            requestAnimationFrame(animateThree);

            if (isMotionActive) {
                angle += 0.0012;
                particleSystem.rotation.y = angle;
                particleSystem.rotation.x = angle * 0.5;
            }

            const positions = particleSystem.geometry.attributes.position.array;
            
            // Mouse gravity effect
            // Convert mouse screen space coordinates to 3D coords approx
            const targetX = (mouseX - window.innerWidth / 2) * 0.35;
            const targetY = -(mouseY - window.innerHeight / 2) * 0.35;

            for (let i = 0; i < particleCount; i++) {
                const px = i * 3;
                const py = i * 3 + 1;
                const pz = i * 3 + 2;

                if (isMotionActive) {
                    // Update baseline organic drift
                    particles[i].x += particles[i].speedX;
                    particles[i].y += particles[i].speedY;
                    particles[i].z += particles[i].speedZ;

                    // Bound particles inside a virtual box
                    if (Math.abs(particles[i].x) > 280) particles[i].speedX *= -1;
                    if (Math.abs(particles[i].y) > 280) particles[i].speedY *= -1;
                    if (Math.abs(particles[i].z) > 280) particles[i].speedZ *= -1;
                }

                // Smooth approach towards baseline
                let targetPX = particles[i].x;
                let targetPY = particles[i].y;
                let targetPZ = particles[i].z;

                // Mouse interaction zone
                const dx = targetX - positions[px];
                const dy = targetY - positions[py];
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 150) {
                    const force = (150 - dist) * 0.08;
                    // Attract/Repel particles depending on speed settings
                    positions[px] += (dx / dist) * force;
                    positions[py] += (dy / dist) * force;
                }

                // Natural return to positions
                positions[px] += (targetPX - positions[px]) * 0.05;
                positions[py] += (targetPY - positions[py]) * 0.05;
                positions[pz] += (targetPZ - positions[pz]) * 0.05;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // Smooth transition for particle colors
        function transitionParticlesColors() {
            const colors = particleSystem.geometry.attributes.color.array;
            const targetPalette = isDarkMode ? darkParticleColors : lightParticleColors;

            for (let i = 0; i < particleCount; i++) {
                const hexColor = targetPalette[Math.floor(Math.random() * targetPalette.length)];
                const targetColor = new THREE.Color(hexColor);
                
                // Animate colors toward target
                let curR = colors[i * 3];
                let curG = colors[i * 3 + 1];
                let curB = colors[i * 3 + 2];

                // Simple ease transition in animation loop or via timer
                const steps = 30;
                let step = 0;
                
                const interval = setInterval(() => {
                    if (step >= steps) {
                        clearInterval(interval);
                        return;
                    }
                    colors[i * 3] += (targetColor.r - colors[i * 3]) * 0.15;
                    colors[i * 3 + 1] += (targetColor.g - colors[i * 3 + 1]) * 0.15;
                    colors[i * 3 + 2] += (targetColor.b - colors[i * 3 + 2]) * 0.15;
                    
                    particleSystem.geometry.attributes.color.needsUpdate = true;
                    step++;
                }, 16);
            }
        }

        // Initialize Three.js
        initThree();
        animateThree();

        // Pause/Play Motion Button
        const btnToggleMotion = document.getElementById('btnToggleMotion');
        btnToggleMotion.addEventListener('click', () => {
            isMotionActive = !isMotionActive;
            btnToggleMotion.innerText = isMotionActive ? "Pause Motion" : "Resume Motion";
        });

        // Confetti Magic Button Action
        const btnExplore = document.getElementById('btnExplore');
        btnExplore.addEventListener('click', () => {
            // Confetti explosion parameters
            const duration = 2.5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 25, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                
                // Confetti bursts from both sides
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);
        });
    </script>
</body>
</html>
