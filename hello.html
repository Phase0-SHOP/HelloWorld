<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Creative Experience</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color-rgb: 10, 10, 12;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-color: #6366f1;
            --accent-secondary: #ec4899;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover-bg: rgba(255, 255, 255, 0.15);
            --glow-color: 99, 102, 241;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Space Grotesk', sans-serif;
            --transition-speed: 0.5s;
        }

        .light-mode {
            --bg-color-rgb: 248, 250, 252;
            --text-color: #0f172a;
            --text-muted: #475569;
            --card-bg: rgba(15, 23, 42, 0.03);
            --card-border: rgba(15, 23, 42, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.08);
            --accent-color: #4f46e5;
            --accent-secondary: #db2777;
            --btn-bg: rgba(15, 23, 42, 0.05);
            --btn-hover-bg: rgba(15, 23, 42, 0.12);
            --glow-color: 79, 70, 229;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: rgb(var(--bg-color-rgb));
            color: var(--text-color);
            font-family: var(--font-sans);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        /* 3D Background Canvas (Layered Behind Card) */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Custom Cursor Glow */
        .cursor-stalker {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(var(--glow-color), 0.12) 0%, rgba(var(--glow-color), 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: width 0.3s, height 0.3s;
            mix-blend-mode: screen;
        }

        .light-mode .cursor-stalker {
            background: radial-gradient(circle, rgba(var(--glow-color), 0.06) 0%, rgba(var(--glow-color), 0) 70%);
            mix-blend-mode: multiply;
        }

        /* App Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 580px;
            text-align: center;
            perspective: 1000px;
            pointer-events: none;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color var(--transition-speed), 
                        background var(--transition-speed);
            transform-style: preserve-3d;
            pointer-events: auto;
        }

        .card:hover {
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3),
                        0 0 40px var(--accent-glow);
        }

        /* Intro Metadata Dashboard Panel */
        .meta-bar {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            transform: translateZ(25px);
        }
        
        .meta-separator {
            color: var(--accent-color);
            opacity: 0.7;
            font-weight: 800;
        }

        /* Typography & Content */
        .tagline {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            display: inline-block;
            position: relative;
            transform: translateZ(30px);
        }

        .tagline::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            border-radius: 2px;
        }

        /* Embedded Text Canvas Wrapper */
        .title-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
            width: 100%;
            height: 180px; /* Fixed height container */
            transform: translateZ(60px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Foreground 3D Text Container (Placed inside card, above glass blur) */
        #text-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* Let pointer events pass to actions/card */
        }

        #text-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
            transform: translateZ(30px);
        }

        /* Buttons & Actions */
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            transform: translateZ(40px);
        }

        .btn {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.9rem 1.8rem;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: var(--btn-bg);
            color: var(--text-color);
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .btn-primary {
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(var(--glow-color), 0.2);
        }

        .btn-primary::before {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(var(--glow-color), 0.35);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-3px);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover svg {
            transform: translateX(3px) scale(1.1);
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            background: var(--btn-hover-bg);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.5s ease;
        }

        /* Floating Info Footer */
        .footer-info {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        .footer-info:hover {
            opacity: 1;
        }

        /* SVG Icons definitions */
        .icon-sun { display: none; }
        .light-mode .icon-sun { display: block; }
        .light-mode .icon-moon { display: none; }

        /* Media Queries */
        @media (max-width: 640px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }
            .title-wrapper {
                height: 140px;
            }
            .subtitle {
                font-size: 0.95rem;
                margin-bottom: 2rem;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Background Canvas -->
    <div id="canvas-container"></div>

    <!-- Custom Cursor Glow -->
    <div class="cursor-stalker" id="cursorStalker"></div>

    <!-- Mode Controller -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
        <!-- Moon Icon -->
        <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 3zm0 2a7 7 0 1 0 5.002 11.901A9.5 9.5 0 0 1 12 5z"/>
        </svg>
        <!-- Sun Icon -->
        <svg class="icon-sun" viewBox="0 0 24 24">
            <path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0-7a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zM5.636 5.636a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 0 1-1.414 1.414L6.222 7.05a1 1 0 0 1-1.414-1.414zm11.314 11.314a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 0 1-1.414 1.414l-1.414-1.414a1 1 0 0 1 0-1.414zM2 12a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2H3a1 1 0 0 1-1-1zm15 0a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2h-2a1 1 0 0 1-1-1zM5.636 18.364a1 1 0 0 1 0-1.414l1.414-1.414a1 1 0 1 1 1.414 1.414l-1.414 1.414a1 1 0 0 1-1.414 0zm11.314-11.314a1 1 0 0 1 0-1.414l1.414-1.414a1 1 0 1 1 1.414 1.414l-1.414 1.414a1 1 0 0 1-1.414 0z"/>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="app-container">
        <div class="card" id="interactiveCard">
            <!-- Sleek Intro Metadata Dashboard -->
            <div class="meta-bar">
                <span id="metaDate">2026.07.18</span>
                <span class="meta-separator">&bull;</span>
                <span id="metaTime">16:19:16</span>
                <span class="meta-separator">&bull;</span>
                <span id="metaLoc">Seoul, KR</span>
            </div>

            <span class="tagline">Creative Tech Showcase</span>
            
            <!-- Embedded WebGL Text Canvas -->
            <div class="title-wrapper" id="titleWrapper">
                <div id="text-canvas-container"></div>
            </div>
            
            <p class="subtitle">
                Welcome to a premium, interactive digital experience built using modern WebGL particle simulation and progressive responsive design.
            </p>
            <div class="actions">
                <button class="btn btn-primary" id="btnExplore">
                    Explore Magic
                    <svg viewBox="0 0 24 24">
                        <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"/>
                    </svg>
                </button>
                <button class="btn btn-secondary" id="btnToggleMotion">
                    Pause Motion
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Info -->
    <div class="footer-info">
        Designed &amp; Engineered &bull; 2026
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // --- REAL-TIME INTRO CLOCK & GEOLOCATION ---
        function updateClock() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const sec = String(now.getSeconds()).padStart(2, '0');
            
            const dateEl = document.getElementById('metaDate');
            const timeEl = document.getElementById('metaTime');
            if (dateEl) dateEl.innerText = `${yyyy}.${mm}.${dd}`;
            if (timeEl) timeEl.innerText = `${hh}:${min}:${sec}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fetch user location safely based on IP (non-blocking)
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const locEl = document.getElementById('metaLoc');
                if (locEl && data && data.city) {
                    locEl.innerText = `${data.city.toUpperCase()}, ${data.country_code}`;
                }
            })
            .catch(() => {
                const locEl = document.getElementById('metaLoc');
                if (locEl) locEl.innerText = "SEOUL, KR";
            });

        // --- CUSTOM CURSOR STALKER ---
        const stalker = document.getElementById('cursorStalker');
        let stalkerX = 0, stalkerY = 0;
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateStalker() {
            stalkerX += (mouseX - stalkerX) * 0.1;
            stalkerY += (mouseY - stalkerY) * 0.1;
            
            stalker.style.left = `${stalkerX}px`;
            stalker.style.top = `${stalkerY}px`;
            requestAnimationFrame(animateStalker);
        }
        animateStalker();

        // --- 3D CARD TILT EFFECT ---
        const card = document.getElementById('interactiveCard');
        const container = document.querySelector('.app-container');
        let currentTiltX = 0;
        let currentTiltY = 0;

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            currentTiltX = (y / (rect.height / 2)) * -12;
            currentTiltY = (x / (rect.width / 2)) * 12;

            card.style.transform = `rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            currentTiltX = 0;
            currentTiltY = 0;
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        // Theme Switch
        const themeToggle = document.getElementById('themeToggle');
        let isDarkMode = true;

        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode', !isDarkMode);
            
            transitionBgParticlesColors();
            transitionTextParticlesColors();
        });

        // Colors
        const darkParticleColors = [0x6366f1, 0xec4899, 0xa855f7, 0x3b82f6];
        const lightParticleColors = [0x4f46e5, 0xdb2777, 0x8b5cf6, 0x2563eb];

        let isMotionActive = true;

        // --- THREE.JS SYSTEM 1: BACKGROUND PARTICLES ---
        let bgScene, bgCamera, bgRenderer, bgParticleSystem;
        let bgParticles = [];
        const bgParticleCount = 1400; // Original dense ambient stars

        function initBgThree() {
            const bgContainer = document.getElementById('canvas-container');
            bgScene = new THREE.Scene();
            
            bgCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            bgCamera.position.z = 300;

            bgRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            bgRenderer.setSize(window.innerWidth, window.innerHeight);
            bgRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            bgContainer.appendChild(bgRenderer.domElement);

            const texture = createParticleTexture();

            // 1. Setup Ambient background stars (Reverted to original values)
            const bgGeometry = new THREE.BufferGeometry();
            const bgPositions = new Float32Array(bgParticleCount * 3);
            const bgColors = new Float32Array(bgParticleCount * 3);
            const activeColorPalette = isDarkMode ? darkParticleColors : lightParticleColors;

            for (let i = 0; i < bgParticleCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 100 + Math.random() * 150; // Original Sphere distribution radius

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi); // Original Z distribution

                bgPositions[i * 3] = x;
                bgPositions[i * 3 + 1] = y;
                bgPositions[i * 3 + 2] = z;

                const hexColor = activeColorPalette[Math.floor(Math.random() * activeColorPalette.length)];
                const color = new THREE.Color(hexColor);
                bgColors[i * 3] = color.r;
                bgColors[i * 3 + 1] = color.g;
                bgColors[i * 3 + 2] = color.b;

                bgParticles.push({
                    x: x, y: y, z: z,
                    speedX: (Math.random() - 0.5) * 0.15, // Original speed
                    speedY: (Math.random() - 0.5) * 0.15,
                    speedZ: (Math.random() - 0.5) * 0.15
                });
            }

            bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
            bgGeometry.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));

            const bgMaterial = new THREE.PointsMaterial({
                size: 3.5, // Original size
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            bgParticleSystem = new THREE.Points(bgGeometry, bgMaterial);
            bgScene.add(bgParticleSystem);
        }

        function createParticleTexture() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 16;
            pCanvas.height = 16;
            const ctx = pCanvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(pCanvas);
        }

        // Trail emitter logic removed to restore original background

        function transitionBgParticlesColors() {
            if (!bgParticleSystem) return;
            const colors = bgParticleSystem.geometry.attributes.color.array;
            const targetPalette = isDarkMode ? darkParticleColors : lightParticleColors;

            for (let i = 0; i < bgParticleCount; i++) {
                const hexColor = targetPalette[Math.floor(Math.random() * targetPalette.length)];
                const targetColor = new THREE.Color(hexColor);
                
                let step = 0;
                const steps = 25;
                const interval = setInterval(() => {
                    if (step >= steps) {
                        clearInterval(interval);
                        return;
                    }
                    colors[i * 3] += (targetColor.r - colors[i * 3]) * 0.18;
                    colors[i * 3 + 1] += (targetColor.g - colors[i * 3 + 1]) * 0.18;
                    colors[i * 3 + 2] += (targetColor.b - colors[i * 3 + 2]) * 0.18;
                    
                    bgParticleSystem.geometry.attributes.color.needsUpdate = true;
                    step++;
                }, 16);
            }
        }

        // --- THREE.JS SYSTEM 2: FOREGROUND EMBEDDED TEXT PARTICLES ---
        let textScene, textCamera, textRenderer, textParticleSystem;
        let textParticles = [];
        let textWidth = 500, textHeight = 180;
        let relativeMouseX = 0, relativeMouseY = 0;

        function initTextThree() {
            const textContainer = document.getElementById('text-canvas-container');
            const rect = textContainer.getBoundingClientRect();
            textWidth = rect.width || 500;
            textHeight = rect.height || 180;

            textScene = new THREE.Scene();
            
            textCamera = new THREE.OrthographicCamera(
                -textWidth / 2, textWidth / 2,
                textHeight / 2, -textHeight / 2,
                1, 1000
            );
            textCamera.position.z = 100;

            textRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            textRenderer.setSize(textWidth, textHeight);
            textRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            textContainer.appendChild(textRenderer.domElement);

            const texture = createParticleTexture();
            
            if (document.fonts) {
                document.fonts.ready.then(() => {
                    setTimeout(() => generateTextParticles(texture), 100);
                });
                
                setTimeout(() => {
                    if (textParticles.length === 0) {
                        generateTextParticles(texture);
                    }
                }, 1200);
            } else {
                generateTextParticles(texture);
            }

            window.addEventListener('mousemove', (e) => {
                const containerRect = textContainer.getBoundingClientRect();
                relativeMouseX = e.clientX - containerRect.left - containerRect.width / 2;
                relativeMouseY = -(e.clientY - containerRect.top - containerRect.height / 2);
            });

            window.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('.actions')) {
                    const containerRect = textContainer.getBoundingClientRect();
                    const localClickX = e.clientX - containerRect.left - containerRect.width / 2;
                    const localClickY = -(e.clientY - containerRect.top - containerRect.height / 2);
                    triggerTextExplosion(localClickX, localClickY);
                }
            });
        }

        function generateTextParticles(texture) {
            if (textParticles.length > 0) return;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = textWidth;
            tempCanvas.height = textHeight;

            tempCtx.fillStyle = '#ffffff';
            const fontSize = textWidth < 450 ? 54 : 70;
            tempCtx.font = `800 ${fontSize}px 'Outfit', 'Space Grotesk', sans-serif`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';

            tempCtx.fillText('HELLO', textWidth / 2, textHeight * 0.28);
            tempCtx.fillText('WORLD', textWidth / 2, textHeight * 0.72);

            const imgData = tempCtx.getImageData(0, 0, textWidth, textHeight);
            const data = imgData.data;
            const coords = [];
            const gap = textWidth < 450 ? 3 : 4; 

            for (let y = 0; y < textHeight; y += gap) {
                for (let x = 0; x < textWidth; x += gap) {
                    const idx = (y * textWidth + x) * 4;
                    const alpha = data[idx + 3];
                    if (alpha > 80) {
                        const localX = x - textWidth / 2;
                        const localY = -(y - textHeight / 2);
                        coords.push({ x: localX, y: localY });
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            const count = coords.length;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const activeColorPalette = isDarkMode ? darkParticleColors : lightParticleColors;

            for (let i = 0; i < count; i++) {
                const pt = coords[i];
                positions[i * 3] = pt.x + (Math.random() - 0.5) * 40;
                positions[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 40;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                const ratio = (pt.x + textWidth / 2) / textWidth;
                const colLeft = new THREE.Color(activeColorPalette[0]);
                const colRight = new THREE.Color(activeColorPalette[1]);
                const blended = colLeft.clone().lerp(colRight, ratio);

                colors[i * 3] = blended.r;
                colors[i * 3 + 1] = blended.g;
                colors[i * 3 + 2] = blended.b;

                textParticles.push({
                    ox: pt.x,
                    oy: pt.y,
                    oz: 0,
                    x: positions[i * 3],
                    y: positions[i * 3 + 1],
                    z: positions[i * 3 + 2],
                    vx: 0, vy: 0, vz: 0,
                    color: blended.clone()
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: textWidth < 450 ? 3.0 : 3.8,
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            textParticleSystem = new THREE.Points(geometry, material);
            textScene.add(textParticleSystem);
        }

        function triggerTextExplosion(localX, localY) {
            if (textParticles.length === 0) return;

            const blastRadius = textWidth < 450 ? 80 : 120;
            const explosionForce = textWidth < 450 ? 12 : 18;

            for (let i = 0; i < textParticles.length; i++) {
                const pt = textParticles[i];
                const dx = pt.x - localX;
                const dy = pt.y - localY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < blastRadius) {
                    const intensity = (blastRadius - dist) / blastRadius;
                    const force = intensity * explosionForce;
                    const angle = Math.atan2(dy, dx);
                    
                    pt.vx += Math.cos(angle) * force + (Math.random() - 0.5) * 3;
                    pt.vy += Math.sin(angle) * force + (Math.random() - 0.5) * 3;
                    pt.vz += (Math.random() - 0.5) * force * 1.5;
                }
            }

            card.style.transform = `rotateX(${currentTiltX * 1.6}deg) rotateY(${currentTiltY * 1.6}deg) translateZ(10px)`;
            setTimeout(() => {
                card.style.transform = `rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
            }, 120);
        }

        function transitionTextParticlesColors() {
            if (!textParticleSystem) return;
            const colors = textParticleSystem.geometry.attributes.color.array;
            const targetPalette = isDarkMode ? darkParticleColors : lightParticleColors;

            for (let i = 0; i < textParticles.length; i++) {
                const pt = textParticles[i];
                const ratio = (pt.ox + textWidth / 2) / textWidth;
                const colLeft = new THREE.Color(targetPalette[0]);
                const colRight = new THREE.Color(targetPalette[1]);
                const targetColor = colLeft.clone().lerp(colRight, ratio);

                let step = 0;
                const steps = 25;
                const interval = setInterval(() => {
                    if (step >= steps) {
                        clearInterval(interval);
                        return;
                    }
                    colors[i * 3] += (targetColor.r - colors[i * 3]) * 0.18;
                    colors[i * 3 + 1] += (targetColor.g - colors[i * 3 + 1]) * 0.18;
                    colors[i * 3 + 2] += (targetColor.b - colors[i * 3 + 2]) * 0.18;
                    
                    textParticleSystem.geometry.attributes.color.needsUpdate = true;
                    step++;
                }, 16);
            }
        }

        function handleResizeTextSystem() {
            const textContainer = document.getElementById('text-canvas-container');
            const rect = textContainer.getBoundingClientRect();
            textWidth = rect.width || 500;
            textHeight = rect.height || 180;

            if (textRenderer) {
                textRenderer.setSize(textWidth, textHeight);
                textCamera.left = -textWidth / 2;
                textCamera.right = textWidth / 2;
                textCamera.top = textHeight / 2;
                textCamera.bottom = -textHeight / 2;
                textCamera.updateProjectionMatrix();

                textParticles = [];
                if (textParticleSystem) textScene.remove(textParticleSystem);
                const texture = createParticleTexture();
                generateTextParticles(texture);
            }
        }

        // --- MAIN ANIMATION & RENDER LOOP ---
        let bgAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            // 1. Ambient Background Stars Physics (Reverted to original spring physics)
            if (bgParticleSystem) {
                if (isMotionActive) {
                    bgAngle += 0.0012; // Original 자전 속도
                    bgParticleSystem.rotation.y = bgAngle;
                    bgParticleSystem.rotation.x = bgAngle * 0.5;
                }
                
                const positions = bgParticleSystem.geometry.attributes.position.array;
                const bgTargetX = (mouseX - window.innerWidth / 2) * 0.35;
                const bgTargetY = -(mouseY - window.innerHeight / 2) * 0.35;

                for (let i = 0; i < bgParticleCount; i++) {
                    const idx = i * 3;
                    
                    if (isMotionActive) {
                        bgParticles[i].x += bgParticles[i].speedX;
                        bgParticles[i].y += bgParticles[i].speedY;
                        bgParticles[i].z += bgParticles[i].speedZ;

                        // Bound particles inside virtual box
                        if (Math.abs(bgParticles[i].x) > 280) bgParticles[i].speedX *= -1;
                        if (Math.abs(bgParticles[i].y) > 280) bgParticles[i].speedY *= -1;
                        if (Math.abs(bgParticles[i].z) > 280) bgParticles[i].speedZ *= -1;
                    }

                    let targetPX = bgParticles[i].x;
                    let targetPY = bgParticles[i].y;
                    let targetPZ = bgParticles[i].z;

                    // Original Mouse repulsion/attract for stars
                    const dx = bgTargetX - positions[idx];
                    const dy = bgTargetY - positions[idx + 1];
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150) {
                        const force = (150 - dist) * 0.08;
                        positions[idx] += (dx / dist) * force;
                        positions[idx + 1] += (dy / dist) * force;
                    }

                    // Original spring return
                    positions[idx] += (targetPX - positions[idx]) * 0.05;
                    positions[idx + 1] += (targetPY - positions[idx + 1]) * 0.05;
                    positions[idx + 2] += (targetPZ - positions[idx + 2]) * 0.05;
                }
                bgParticleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Render Background systems
            bgRenderer.render(bgScene, bgCamera);

            // 3. Foreground Text Particles Simulation
            if (textParticleSystem) {
                const positions = textParticleSystem.geometry.attributes.position.array;

                const springStrength = 0.05;
                const friction = 0.86;
                const repelRadius = 38;
                const repelStrength = 1.1;

                for (let i = 0; i < textParticles.length; i++) {
                    const pt = textParticles[i];

                    // Spring return forces
                    const ax = (pt.ox - pt.x) * springStrength;
                    const ay = (pt.oy - pt.y) * springStrength;
                    const az = (pt.oz - pt.z) * springStrength;

                    pt.vx += ax;
                    pt.vy += ay;
                    pt.vz += az;

                    // Hover repel physics
                    const rdx = pt.x - relativeMouseX;
                    const rdy = pt.y - relativeMouseY;
                    const rdist = Math.sqrt(rdx * rdx + rdy * rdy);

                    if (rdist < repelRadius) {
                        const rIntensity = (repelRadius - rdist) / repelRadius;
                        const rForce = rIntensity * repelStrength;
                        const rAngle = Math.atan2(rdy, rdx);

                        pt.vx += Math.cos(rAngle) * rForce;
                        pt.vy += Math.sin(rAngle) * rForce;
                    }

                    pt.vx *= friction;
                    pt.vy *= friction;
                    pt.vz *= friction;

                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.z += pt.vz;

                    const idx = i * 3;
                    positions[idx] = pt.x;
                    positions[idx + 1] = pt.y;
                    positions[idx + 2] = pt.z;
                }

                textParticleSystem.geometry.attributes.position.needsUpdate = true;
                textRenderer.render(textScene, textCamera);
            }
        }

        // Handle Resizing
        window.addEventListener('resize', () => {
            bgCamera.aspect = window.innerWidth / window.innerHeight;
            bgCamera.updateProjectionMatrix();
            bgRenderer.setSize(window.innerWidth, window.innerHeight);

            handleResizeTextSystem();
        });

        // Initialize Systems
        initBgThree();
        initTextThree();
        animate();

        // Pause/Play Motion Button
        const btnToggleMotion = document.getElementById('btnToggleMotion');
        btnToggleMotion.addEventListener('click', () => {
            isMotionActive = !isMotionActive;
            btnToggleMotion.innerText = isMotionActive ? "Pause Motion" : "Resume Motion";
        });

        // Explore Magic Action
        const btnExplore = document.getElementById('btnExplore');
        btnExplore.addEventListener('click', () => {
            // Confetti
            const duration = 2.5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 25, spread: 360, ticks: 60, zIndex: 1000 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);

            // Trigger massive text particle explosion
            if (textParticles.length > 0) {
                const centerForce = textWidth < 450 ? 12 : 20;
                for (let i = 0; i < textParticles.length; i++) {
                    const pt = textParticles[i];
                    const dist = Math.sqrt(pt.x * pt.x + pt.y * pt.y);
                    const force = (1.0 - (dist / (textWidth / 2))) * centerForce;
                    
                    pt.vx += (pt.x / (dist || 1)) * force + (Math.random() - 0.5) * 5;
                    pt.vy += (pt.y / (dist || 1)) * force + (Math.random() - 0.5) * 5;
                    pt.vz += (Math.random() - 0.5) * force * 1.5;
                }
            }
        });
    </script>
